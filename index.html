<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts via <link> rather than a CSS @import, so the stylesheet request
         is not serialized behind index.css. Big Shoulders Display is the
         option-B display face; its binary is only fetched if --font-display
         is flipped to var(--font-display-b), because browsers download a
         @font-face only when rendered text matches it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Big+Shoulders+Display:wght@300;400;600;700;800;900&display=swap">
    <title>Simum Tasnim — Portfolio</title>
    <meta name="description" content="MBA candidate specializing in consulting and product management. Unlocking $2M in cost savings through data-driven strategic solutions.">
      <meta name="theme-color" content="#F9F9F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0614" media="(prefers-color-scheme: dark)">
  </head>
