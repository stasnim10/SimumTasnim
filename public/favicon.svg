<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ST — Simum Tasnim">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2E88"/>
      <stop offset="55%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFC24B"/>
    </linearGradient>
  </defs>
  <style>
    .ground { fill: #0B0614; }
    .mark   { fill: url(#sunset); }
    @media (prefers-color-scheme: light) {
      .ground { fill: #F9F9F6; }
    }
  </style>
  <rect class="ground" width="64" height="64" rx="12"/>
  <text class="mark" x="32" y="44"
        font-family="Cormorant Garamond, Garamond, Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="600" letter-spacing="-1" text-anchor="middle">ST</text>
</svg>
